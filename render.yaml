# Render Blueprint — Comein 백엔드(FastAPI) 배포 정의
# 대시보드에서 New → Blueprint → 이 레포 선택하면 아래 설정대로 서비스가 만들어진다.
# 상세 절차·주의점: docs/15_DEPLOY.md
services:
  - type: web
    name: comein-api
    runtime: python
    plan: free            # 15분 무요청 시 슬립 → keep-alive 는 docs/15_DEPLOY.md 참고
    region: singapore     # 한국에서 가장 가까운 무료 리전
    rootDir: backend      # 모노레포 — 이 폴더만 보고 빌드
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      # 쉼표 구분. 예) https://comein.vercel.app,https://comein.com
      - key: CORS_ORIGINS
        sync: false
      # Vercel 프리뷰 도메인 허용이 필요할 때만. 예) https://.*\.vercel\.app
      - key: CORS_ORIGIN_REGEX
        sync: false
      # DATABASE_URL · REDIS_URL 은 없다 — 이 서버는 DB 에 붙지 않는다.
      # 저장은 프론트가 Supabase 로 직행한다(docs/24 §16). 대시보드에 옛 값이
      # 남아 있어도 무해하지만, 지우는 편이 오해를 줄인다.
      - key: JWT_SECRET
        generateValue: true   # Render 가 임의 값 생성 (직접 넣지 말 것)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
