# Supabase 재우지 않기 — 하루 두 번 실제 쿼리 한 번.
#
# 무료 플랜은 7일간 DB 활동이 적으면 프로젝트를 정지한다. 그리고 **정지된 프로젝트는
# 요청으로 깨울 수 없다** — 대시보드에서 사람이 복구해야 한다(복구 창 1년).
# 그래서 이 워크플로는 '깨우는' 장치가 아니라 '재우지 않는' 장치다.
#
# 왜 백엔드의 /health/db 가 아니라 여기로 직접 치는가:
#   그 엔드포인트는 지금 db:"down" 을 0.5 초 만에 돌려준다 — DB 왕복이 아예 없다.
#   그걸 아무리 자주 때려도 Supabase 에는 아무 일도 일어나지 않는다(docs/15_DEPLOY.md §4).
#   PostgREST 는 제품이 실제로 쓰는 길이고(브라우저 → Supabase 직행), 백엔드 생사와 무관하다.
#
# 정시성은 필요 없다. GitHub 의 cron 은 흔히 지연되지만, 하루 몇 번이면 충분한 일이라
# 몇십 분 밀려도 상관없다. 정각을 피한 것은 그 시각이 가장 붐비기 때문이다.
name: keepalive-supabase

on:
  schedule:
    - cron: "17 3 * * *"    # 12:17 KST
    - cron: "17 15 * * *"   # 00:17 KST
  workflow_dispatch:        # 손으로도 한 번 돌려볼 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase 에 실제 쿼리 한 번
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # 비밀값이 없으면 조용히 통과시키지 않는다 — 조용히 죽은 keep-alive 는
          # 없느니만 못하다(지키고 있다고 믿는 동안 7일이 지난다).
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 없다. Settings → Secrets and variables → Actions 에 넣는다."
            exit 1
          fi

          # anon 키 + RLS 로 읽는다. 빈 배열이 와도 상관없다 — 여기서 필요한 것은
          # 데이터가 아니라 '실제로 DB 를 한 번 건드렸다' 는 사실이다.
          code=$(curl -sS -m 30 -o /tmp/body.txt -w "%{http_code}" \
            "${URL%/}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "status=${code}"
          head -c 200 /tmp/body.txt || true
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Supabase 응답이 ${code} 다. 키가 바뀌었거나, 테이블/정책이 달라졌거나, 이미 정지됐을 수 있다(정지는 대시보드에서만 복구된다)."
            exit 1
          fi
